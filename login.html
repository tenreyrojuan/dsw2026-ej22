<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedPortal - Inicio de Sesión</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">
  <script src="login.js"></script>
</head>
<body>
  <div class="login-container">    
    <div class="medportal-brand">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#163660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="14"/>
          <line x1="9" y1="11" x2="15" y2="11"/>
        </svg>
      </div>
      <h2>MedPortal</h2>
    </div>

    <form>
      <h3>Bienvenido de nuevo</h3>
      <p class="subtitle">Por favor, autentíquese para acceder al portal de proveedores.</p>

      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" name="username" placeholder="Ingrese ID de admin" required>
      <br>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
      <br>

      <button type="submit">Iniciar Sesión ➔</button>

      <!-- Aviso de seguridad al final de la tarjeta -->
      <div class="security-footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <p><strong>Solo Acceso Seguro:</strong> Este sistema es para personal médico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.</p>
      </div>
    </form>
    
  </div>
</body>
</html>
