<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="patient_login_style.css">

  <script src="login.js"></script>
</head>
<body>
  <header class="main-header">
      <span class="m-h-medPortal" >MedPortal</span>
    <div class="main-support">
      <span>Inicio</span>
      <span>Soporte</span>
      <span>Preguntas Frecuentes</span>
    </div>
    <span class="main-help">Ayuda</span>
  </header>
  <div class="login-container">
    <form novalidate>
      <div class="login-intro">
        <h2 class="l-i-medPortal">MedPortal</h2>
        <h3 class="l-i-access">Acceso al Paciente</h3>
        <span>Ingrese sus credenciales de identificación para continuar.</span>
      </div>
      <label for="email">Correo Electrónico:</label>
      <input placeholder="ejemplo@correo.com" type="text" id="username" name="username" required>
      <br>
      <label for="password">DNI / Número de Identificación:</label>
      <input placeholder="Numero de documento" type="password" id="password" name="password" required>
      <br>
      <button type="submit">Ingresar al Portal Médico &RightArrow;</button>
      <div class="l-help">
        <span>¿No tiene una cuenta o tiene problemas para acceder?</span>
        <br>
        <span style="color: rgb(14, 70, 130)  ;" class="l-h-supportLink">Contactar con soporte técnico</span>
      </div>
    </form>
  </div>
</body>
</html>
